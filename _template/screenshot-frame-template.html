<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* No forced aspect ratio — the window sizes exactly to the screenshot's
     own native resolution (whatever the recording/capture happened to be).
     Resize the browser viewport to match window.offsetWidth/offsetHeight
     (read via JS after load) before taking the final screenshot, so there is
     no extra page background or scrollbar around the card. */
  html,body{margin:0;padding:0;background:#e9eaed;font-size:0;}
  body{
    font-family: -apple-system, "SF Pro Text", ui-sans-serif, system-ui, sans-serif;
  }
  .window{
    display:inline-block;
    font-size:14px;
    border-radius:14px;
    overflow:hidden;
    background:#ffffff;
    box-shadow: 0 25px 60px rgba(0,0,0,.16), 0 4px 14px rgba(0,0,0,.08);
  }
  .titlebar{
    height:34px;
    background:#ebebec;
    border-bottom:1px solid #dcdcde;
    display:flex; align-items:center;
    padding:0 14px;
    position:relative;
  }
  .dot{width:11px;height:11px;border-radius:50%;margin-right:7px;}
  .dot.red{background:#ff5f56} .dot.yellow{background:#ffbd2e} .dot.green{background:#27c93f}
  .titlebar .label{
    position:absolute; left:0; right:0; text-align:center;
    font-size:12.5px; color:#7c7c80; pointer-events:none;
  }
  .frame{
    position:relative;
    line-height:0; /* kill the inline-img whitespace gap */
  }
  .frame img{
    display:block;
    width:auto; height:auto; /* native resolution, no scaling/cropping */
  }
  /* Click-highlight: simple circle/ellipse outline around the element that was clicked.
     Position with top/left/width/height in px (or %) relative to .frame, duplicate the
     div for multiple highlights, delete it entirely if this screenshot has no click to mark. */
  .highlight{
    position:absolute;
    border:3px solid #ff3b30;
    border-radius:50%;
    box-shadow:0 0 0 3px rgba(255,59,48,.18);
    pointer-events:none;
  }
</style></head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
      <div class="label"><!-- optional: app name / URL / window title --></div>
    </div>
    <div class="frame">
      <img src="<!-- SCREENSHOT_PATH_OR_DATA_URI -->" />
      <!-- <div class="highlight" style="top:180px;left:420px;width:80px;height:36px;"></div> -->
    </div>
  </div>
</body></html>
